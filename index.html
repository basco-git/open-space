<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>곰 피규어 3D</title>
<style>
  :root{--bg:#0b0f14;--panel:rgba(11,15,20,.88);--line:#1e293b;--text:#e2e8f0;--dim:#64748b;--accent:#7dd3fc;--ok:#86efac;--bad:#fca5a5}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
  #c{display:block;width:100%;height:100%;touch-action:none}
  .panel{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:10px 12px;font-size:12.5px;line-height:1.6;backdrop-filter:blur(6px)}
  #hud{left:12px;top:12px;max-width:min(330px,calc(100vw - 24px))}
  #hud h1{margin:0 0 4px;font-size:14px;color:var(--accent);font-weight:600}
  #hud .sub{color:var(--dim);margin-bottom:6px}
  #steps{margin:0;padding:0;list-style:none}
  #steps li{color:var(--dim)}
  #steps li.ok{color:var(--ok)} #steps li.ok::before{content:"✓ ";color:#22c55e}
  #steps li.bad{color:var(--bad)} #steps li.bad::before{content:"✗ ";color:#ef4444}
  #steps li.run::before{content:"… ";color:#eab308}
  #steps li:not(.ok):not(.bad):not(.run)::before{content:"· "}
  #stat{margin-top:6px;color:var(--text)}
  #fix{margin-top:8px;padding:8px;border-radius:8px;background:#2a1215;border:1px solid #7f1d1d;
    color:#fecaca;display:none;white-space:pre-wrap}
  #fix.show{display:block}
  #ctl{right:12px;top:12px;text-align:right}
  button{background:#1e293b;color:var(--text);border:1px solid #334155;border-radius:8px;
    padding:6px 10px;font-size:12px;cursor:pointer;margin:2px}
  button:hover{background:#334155} button.on{background:#0369a1;border-color:#0ea5e9}
  #drop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(3,105,161,.25);border:3px dashed #0ea5e9;font-size:18px;pointer-events:none}
  #drop.show{display:flex}
  #cmp{left:12px;bottom:12px;max-width:calc(100vw - 24px);display:none;overflow-x:auto}
  #cmp.show{display:block}
  #cmp table{border-collapse:collapse;font-size:12px}
  #cmp th,#cmp td{padding:2px 8px;text-align:right;white-space:nowrap}
  #cmp th:first-child,#cmp td:first-child{text-align:left}
  #cmp th{color:var(--dim);font-weight:500}
  #cmp tr.cur td{color:var(--accent)}
  .dim{color:var(--dim)}
  @media (max-width:600px){ #ctl{top:auto;bottom:12px} #cmp{bottom:110px} #hud{font-size:11.5px} }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="panel" id="hud">
  <h1>곰 피규어 3D</h1>
  <div class="sub">끌어서 돌리기 · 휠/두 손가락으로 확대 · 오른쪽 끌기로 이동</div>
  <ul id="steps">
    <li id="s1">three.js 와 Spark 불러오기</li>
    <li id="s2">SparkRenderer 장면에 넣기</li>
    <li id="s3">파일 받기</li>
    <li id="s4">알갱이로 풀기</li>
    <li id="s5">크기 재서 카메라 놓기</li>
  </ul>
  <div id="stat" class="dim"></div>
  <div id="fix"></div>
</div>

<div class="panel" id="ctl">
  <div><button id="home">촬영 시점</button><button id="fit">전체 보기</button><button id="flip">위아래 뒤집기</button></div>
  <div><button id="spin">자동 회전</button><button id="open">파일 비교…</button></div>
  <input type="file" id="pick" accept=".sog,.spz,.ply,.splat" multiple hidden>
</div>

<div class="panel" id="cmp">
  <div class="dim" style="margin-bottom:4px">불러온 파일 비교 (파일을 화면에 끌어다 놓아도 됩니다)</div>
  <table><thead><tr><th>파일</th><th>형식</th><th>크기(바이트)</th><th>MB</th><th>알갱이</th><th>바이트/알갱이</th><th>풀기(초)</th></tr></thead>
  <tbody id="rows"></tbody></table>
</div>
<div id="drop">.sog / .spz / .compressed.ply / .ply 를 놓으세요</div>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
  "@sparkjsdev/spark":"https://sparkjs.dev/releases/spark/2.4.0/spark.module.js"
}}
</script>
<script type="module">
/* ===== 여기만 바꾸면 됩니다 ===== */
let SPLAT_FILE = "scene.sog";      // 같은 폴더의 장면 파일
// 처음 시점: 첫 촬영 카메라 자리에서 피규어(원점 위)를 바라본다. build.py --level 이 출력한 값
const HOME_VIEW = { pos: [0.129, 1.136, 2.648], target: [0.0, 0.371, 0.0] };
/* ================================ */
// 주소 뒤에 ?f=다른파일.spz 를 붙이면 그 파일을 엽니다.
SPLAT_FILE = new URLSearchParams(location.search).get("f") || SPLAT_FILE;

const el = id => document.getElementById(id);
const mark = (id, cls, text) => { el(id).className = cls; if (text) el(id).textContent = text; };
const fail = msg => { const f = el("fix"); f.classList.add("show"); f.textContent = "막혔습니다\n" + msg; };
addEventListener("unhandledrejection", e => fail(String(e.reason?.message || e.reason)));

/* 확장자 → Spark 안쪽 형식 이름. .sog 는 "pcsogszip" 이다. .compressed.ply 도 Spark 에서는 "ply". */
function typeOf(name) {
  const n = name.toLowerCase();
  if (n.endsWith(".compressed.ply")) return { fileType: "ply", label: "compressed.ply" };
  const ext = n.split(".").pop();
  const map = { sog: "pcsogszip", spz: "spz", ply: "ply", splat: "splat", ksplat: "ksplat" };
  if (!map[ext]) throw new Error(`모르는 확장자: .${ext}`);
  return { fileType: map[ext], label: ext };
}

let THREE, OrbitControls, SPARK;
try {
  THREE = await import("three");
  ({ OrbitControls } = await import("three/addons/controls/OrbitControls.js"));
  SPARK = await import("@sparkjsdev/spark");
  mark("s1", "ok");
} catch (e) { mark("s1", "bad"); fail("라이브러리를 못 불러왔습니다. 인터넷 연결을 확인하세요.\n" + e.message); throw e; }

const canvas = el("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0f14);
const camera = new THREE.PerspectiveCamera(55, 1, 0.01, 1000);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
camera.position.set(1, 0.5, 1);

/* 함정 1: SparkRenderer 를 장면에 넣지 않으면 오류 없이 화면이 까맣다 */
const spark = new SPARK.SparkRenderer({ renderer });
scene.add(spark);
mark("s2", "ok");

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();

let mesh = null, flipped = false, firstFrameMs = null, waitFirst = false;

async function loadBytes(bytes, name) {
  const { fileType, label } = typeOf(name);
  const t = performance.now();
  const m = new SPARK.SplatMesh({ fileBytes: bytes, fileType });
  await m.initialized;
  const sec = (performance.now() - t) / 1000;
  const n = m.packedSplats?.numSplats ?? m.numSplats ?? 0;
  if (!n) throw new Error("알갱이가 0개입니다");
  if (mesh) { scene.remove(mesh); mesh.dispose?.(); }
  mesh = m; scene.add(mesh);
  if (flipped) { mesh.scale.y = -1; mesh.scale.z = -1; }
  return { n, sec, label };
}

/* 함정 3: Box3.setFromObject 는 SplatMesh 에 빈 상자를 준다. Spark 의 getBoundingBox 를 쓴다. */
function fit() {
  let box = null;
  try { box = mesh.getBoundingBox(true); } catch (e) {}
  if (!box || box.isEmpty()) { mark("s5", "bad"); fail("크기를 못 쟀습니다. 손으로 끌어 찾으세요."); return; }
  box.applyMatrix4(mesh.matrixWorld);
  const c = box.getCenter(new THREE.Vector3());
  const r = box.getSize(new THREE.Vector3()).length() * 0.5;
  controls.target.copy(c);
  camera.position.copy(c).add(new THREE.Vector3(0, r * 0.35, r * 1.4));
  camera.near = Math.max(r / 1000, 0.001); camera.far = r * 60;
  camera.updateProjectionMatrix();
  mark("s5", "ok", `크기 재서 카메라 놓기 (반지름 ${r.toFixed(2)})`);
}

const rows = [];
function addRow(name, bytes, info) {
  rows.push({ name, bytes, ...info });
  el("rows").innerHTML = rows.map((r, i) =>
    `<tr class="${i === rows.length - 1 ? "cur" : ""}"><td>${r.name}</td><td>${r.label}</td>` +
    `<td>${r.bytes.toLocaleString("ko-KR")}</td><td>${(r.bytes / 1e6).toFixed(2)}</td>` +
    `<td>${r.n.toLocaleString("ko-KR")}</td><td>${(r.bytes / r.n).toFixed(1)}</td><td>${r.sec.toFixed(2)}</td></tr>`).join("");
  el("cmp").classList.add("show");
}

// 처음 장면 받기
mark("s3", "run");
let buf;
try {
  const t0 = performance.now();
  const res = await fetch(SPLAT_FILE);
  if (!res.ok) throw new Error(`서버 응답 ${res.status}`);
  buf = new Uint8Array(await res.arrayBuffer());
  mark("s3", "ok", `파일 받기 ${SPLAT_FILE} ${(buf.byteLength / 1e6).toFixed(2)}MB · ${((performance.now() - t0) / 1000).toFixed(1)}초`);
} catch (e) {
  mark("s3", "bad"); fail(`"${SPLAT_FILE}" 를 못 받았습니다: ${e.message}\nfile:// 로 열었다면 로컬 서버로 여세요.`); throw e;
}
mark("s4", "run");
try {
  const info = await loadBytes(buf, SPLAT_FILE);
  mark("s4", "ok", `알갱이로 풀기 ${info.n.toLocaleString("ko-KR")}개 · ${info.sec.toFixed(1)}초`);
} catch (e) { mark("s4", "bad"); fail("알갱이로 못 풀었습니다: " + e.message); throw e; }
fit();
home();
waitFirst = true;

function home() {
  const f = flipped ? -1 : 1;
  camera.position.set(HOME_VIEW.pos[0], HOME_VIEW.pos[1] * f, HOME_VIEW.pos[2] * f);
  controls.target.set(HOME_VIEW.target[0], HOME_VIEW.target[1] * f, HOME_VIEW.target[2] * f);
  controls.update();
}

// 비교용 파일 끌어다 놓기 / 고르기
async function handleFiles(list) {
  for (const f of list) {
    try {
      const bytes = new Uint8Array(await f.arrayBuffer());
      const info = await loadBytes(bytes, f.name);
      addRow(f.name, bytes.byteLength, info);
      el("stat").textContent = `지금 보는 파일: ${f.name}`;
    } catch (e) { fail(`${f.name}: ${e.message}`); }
  }
}
addEventListener("dragover", e => { e.preventDefault(); el("drop").classList.add("show"); });
addEventListener("dragleave", e => { if (!e.relatedTarget) el("drop").classList.remove("show"); });
addEventListener("drop", e => { e.preventDefault(); el("drop").classList.remove("show"); handleFiles([...e.dataTransfer.files]); });
el("open").onclick = () => el("pick").click();
el("pick").onchange = e => handleFiles([...e.target.files]);

el("fit").onclick = fit;
el("home").onclick = home;
el("flip").onclick = () => { flipped = !flipped; mesh.scale.y *= -1; mesh.scale.z *= -1; mesh.updateMatrixWorld(true); fit(); };
let spinning = false;
el("spin").onclick = e => { spinning = !spinning; controls.autoRotate = spinning; controls.autoRotateSpeed = 1.2; e.target.classList.toggle("on", spinning); };

window.viewer = { THREE, SPARK, scene, camera, controls, renderer, spark, get mesh() { return mesh; }, fit };

(function loop() {
  requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene, camera);
  if (waitFirst) {
    waitFirst = false;
    requestAnimationFrame(() => {
      firstFrameMs = performance.now();   // performance.now() 는 페이지 열기(내비게이션 시작)부터 잰 값
      el("stat").textContent = `첫 화면까지 ${(firstFrameMs / 1000).toFixed(1)}초 (페이지 열기부터)`;
      window.viewer.firstFrameMs = firstFrameMs;
    });
  }
})();
</script>
</body>
</html>
